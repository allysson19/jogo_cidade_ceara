<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Adivinhe o município do Ceará</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;--bg:#f3f6fb;--card:#fff;--fg:#0f172a;--mut:#64748b;--bd:#e2e8f0;--land:#c9d6ea;--ac:#4f46e5;--ac2:#eef2ff;--ok:#10b981;--cur:#f97316;--sk:#94a3b8;--bad:#ef4444;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;gap:12px;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.pills{display:flex;gap:8px}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 1px 2px #0f172a0d}
.pill.low{background:#fef2f2;color:var(--bad);border-color:#fecaca}
main{flex:1;min-height:0;display:flex;gap:12px;flex-direction:column}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:0 4px 18px #0f172a0f}
#wrap{flex:1;min-height:0;position:relative;overflow:hidden;background:linear-gradient(160deg,#f8fbff,#e8effa)}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
path{fill:var(--land);stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .25s}
path.ok{fill:var(--ok)}path.sk{fill:var(--sk)}path.bad{fill:var(--bad)}path.cur{fill:var(--cur);stroke:var(--fg)}
.click path:hover:not(.ok):not(.sk){fill:#a5b4fc}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;padding:0;font-size:1.1rem}
button,select{font:inherit;font-weight:600;color:var(--fg);background:#fff;border:1px solid var(--bd);border-radius:12px;padding:9px 14px;cursor:pointer;transition:.15s}
button:hover{background:var(--ac2);border-color:#c7d2fe}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.p:hover{background:#4338ca}
#panel{padding:16px;display:flex;flex-direction:column;gap:12px}
#q{font-size:1.05rem;font-weight:700}
#msg{color:var(--mut);min-height:1.4em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:140px;font:inherit;padding:11px 14px;border-radius:12px;border:1.5px solid var(--bd);outline:none}
input[type=text]:focus{border-color:var(--ac);box-shadow:0 0 0 3px #4f46e51f}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .3s}
label{font-size:.85rem;color:var(--mut)}
.ov{position:fixed;inset:0;background:#0f172a73;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.ov.h{display:none}
.box{background:#fff;border-radius:24px;padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px #0f172a40}
.box h2{margin:0 0 6px;font-size:1.4rem}.box p{color:var(--mut);margin:6px 0 18px}
.big{font-size:3rem;font-weight:800;color:var(--ac);line-height:1}.big small{font-size:1.3rem;color:var(--mut)}
details{text-align:left;margin:0 0 16px;max-height:140px;overflow:auto;font-size:.85rem;color:var(--mut)}summary{cursor:pointer;font-weight:600}
#go{display:none;padding:14px;font-size:1.05rem}.idle #go{display:block}.idle #tin,.idle .acts,.idle #sl{display:none!important}
@media(min-width:820px){main{flex-direction:row}#panel{width:340px;flex:none;overflow:auto}}
</style></head><body>

<div id="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zr" title="Ver tudo">⤢</button></div></section>

<div class="bar"><i id="bar"></i></div>

<div id="q"></div>

<label id="sl"><input type="checkbox" id="sug"> sugestões (autocompletar)</label>
<div id="msg"></div></aside></main>

<div class="row" style="justify-content:center"><button id="see">Ver mapa</button><button class="p" id="again">Jogar de novo</button></div></div></div>

 if(mode=="free"){const r=D.map((_,i)=>i).filter(i=>!done(P[i]));if(!r.length)return;const i=r[Math.random()*r.length|0];P[i].classList.add("cur");setTimeout(()=>P[i].classList.remove("cur"),1500);say(`💡 O município piscando começa com “${D[i][0][0]}”.`);return}
 if(cur==null)return;hinted=true;const n=D[cur][0];
 if(mode=="type")say(`💡 Começa com “${n[0]}” e tem ${n.replace(/ /g,"").length} letras.`);
 else{P[cur].classList.add("cur");setTimeout(()=>P[cur]&&P[cur].classList.remove("cur"),1200);say("💡 Olhe a região piscando.")}};
$("#skip").onclick=()=>{if(!running||cur==null)return;P[cur].classList.remove("cur");P[cur].classList.add("sk");next()};
$("#giveup").onclick=()=>{if(running&&confirm("Quer mesmo desistir e ver o resultado?"))finish("giveup")};
$("#focus").onclick=()=>cur!=null&&focusOn(cur);
$("#go").onclick=begin;$("#again").onclick=setup;$("#mode").onchange=setup;$("#see").onclick=()=>$("#end").classList.add("h");
$("#sug").onchange=e=>{$("#dl").innerHTML=e.target.checked?D.map(d=>d[0]).sort().map(n=>`<option value="${n}">`).join(""):"";$("#ans").setAttribute("list",e.target.checked?"dl":"")};
setup();
</script></body></html>
